<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librería - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">📚 Libros del subsuelo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Formulario de contacto -->
    <h1 class="otrosTitulos text-center mb-4 mt-4">Contactate con nosotros</h1>
        <form class="formulario" id="form">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="form-control mb-3" placeholder="Nombre" required minlength="3" maxlength="30">

                <label for="mail" class="form-label">Email:</label>
                <input type="email" id="mail" name="mail" class="form-control mb-3" placeholder="Email" required>

                <label for="asunto" class="form-label">Asunto:</label>
                <select id="asunto" class="form-select mb-3" required>
                    <option value="" disabled selected>Seleccioná una opción</option>
                    <option value="consulta">Consulta</option>
                    <option value="reclamo">Reclamo</option>
                    <option value="sugerencia">Sugerencia</option>
                </select>

                <label for="mensaje" class="form-label">Mensaje:</label>
                <textarea id="mensaje" class="form-control mb-4" rows="4" placeholder="Escribí tu mensaje..." required></textarea>

                <div class="text-center">
                <button type="submit" class="btn btn-primary w-50">Enviar</button>
                </div>
        </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
</body>
</html>
